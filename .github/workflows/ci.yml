name: CI

# Lancée à la demande seulement (onglet Actions ou `gh workflow run ci.yml -f …`), job par job : la suite complète
# est longue. Un job en échec se relance seul avec `gh run rerun <id> --failed`.
on:
  workflow_dispatch:
    inputs:
      qualite:
        description: 'Qualité et build (lint, types, format, tests unitaires, build)'
        type: boolean
        default: true
      e2e:
        description: 'Bout en bout (Playwright, axe)'
        type: boolean
        default: true
      e2e_filtre:
        description: 'Arguments Playwright (ex. « e2e/admin.spec.ts --project=desktop-1440 » ou « -g export ») ; vide = toute la suite'
        type: string
        default: ''
      lighthouse:
        description: 'Performance (Lighthouse, mobile)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et build
    if: inputs.qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types et exemples générés à jour avec le contrat
        run: |
          pnpm contract:generate
          git diff --exit-code -- src/lib/api/schema.d.ts src/mocks/data/contract-examples.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Phase 1 : le site est construit sur les mocks (pas d'API joignable pendant le build).
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

  e2e:
    name: Bout en bout (Playwright, axe)
    runs-on: ubuntu-latest
    needs: quality
    # Après « Qualité et build » s'il est lancé, seul sinon.
    if: ${{ !cancelled() && inputs.e2e && needs.quality.result != 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Filtre passé par l'environnement (pas d'interpolation dans le script) ; découpé en arguments à dessein.
      - run: pnpm test:e2e $E2E_FILTRE
        env:
          E2E_FILTRE: ${{ inputs.e2e_filtre }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Performance (Lighthouse, mobile)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ !cancelled() && inputs.lighthouse && needs.quality.result != 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Même build que l'e2e (mocks) ; seuils et budget de JavaScript dans `lighthouserc.json`. Les pages à formulaire
      # chargent les mocks MSW dans le navigateur (~175 Ko, absents en production) : leur performance n'y est qu'indicative.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - run: pnpm dlx @lhci/cli@0.15.1 autorun
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rapport-lighthouse
          path: lighthouse-report/
          retention-days: 14
