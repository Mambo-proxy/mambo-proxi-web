name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types et exemples générés à jour avec le contrat
        run: |
          pnpm contract:generate
          git diff --exit-code -- src/lib/api/schema.d.ts src/mocks/data/contract-examples.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Phase 1 : le site est construit sur les mocks (pas d'API joignable pendant le build).
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

  e2e:
    name: Bout en bout (Playwright, axe)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
