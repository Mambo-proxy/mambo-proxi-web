name: Déploiement

# Lancé à la demande seulement (onglet Actions ou `gh workflow run deploy.yml`) : construit l'image du site, la pousse
# dans le registre GitHub (ghcr.io), puis la démarre sur le VPS par SSH (service `web` de la pile /opt/mambo, mise en
# place par mambo-proxi-api : docs/DEPLOIEMENT.md de ce dépôt-là).
#
# Variables de dépôt (lues au build) : NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_TURNSTILE_SITE_KEY,
# NEXT_PUBLIC_MEDIA_URL, NEXT_PUBLIC_MAP_TILES_URL, NEXT_PUBLIC_MAP_TILES_CREDIT, SITE_ENV (production : indexation).
# Secrets de dépôt : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée de l'utilisateur deploy), VPS_KNOWN_HOSTS.
on:
  workflow_dispatch:
    inputs:
      deployer:
        description: 'Déployer sur le serveur après la construction (sinon : image seulement)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mambo-proxy/mambo-proxi-web

jobs:
  image:
    name: Image (construction et envoi dans ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_MEDIA_URL=${{ vars.NEXT_PUBLIC_MEDIA_URL }}
            NEXT_PUBLIC_MAP_TILES_URL=${{ vars.NEXT_PUBLIC_MAP_TILES_URL }}
            NEXT_PUBLIC_MAP_TILES_CREDIT=${{ vars.NEXT_PUBLIC_MAP_TILES_CREDIT }}
            SITE_ENV=${{ vars.SITE_ENV || 'preproduction' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement sur le serveur (SSH)
    needs: image
    if: inputs.deployer
    runs-on: ubuntu-latest
    steps:
      - name: Clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: deploy-web.sh sur le serveur
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Jeton éphémère du workflow transmis par l'entrée standard (jamais dans la ligne de commande distante).
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin && bash /opt/mambo/deploy-web.sh '$TAG'"
